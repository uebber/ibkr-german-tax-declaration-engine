      SOY: 10000 USD (acquired at ECB rate 1.05 → cost basis 9523.81 EUR)
      Buy: 50 AAPL @ 150 USD = 7500 USD gross on Jun 20
      ECB rate on Jun 20: 1.15 USD/EUR → 7500 USD = 6521.74 EUR

      Currency FIFO:
