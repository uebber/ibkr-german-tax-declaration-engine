          soy_short_proceeds_eur: "1136.36"
          soy_short_opening_date: "2022-09-10"
          soy_fallback_ecb_rate: "0.88"
      fx_trades:
        - type: CROSS_CURRENCY
          date: "2023-08-15"
          from_currency: CHF
          from_amount: "2000.00"
          to_currency: GBP
          to_amount: "1500.00"
          ecb_rate_from: "0.96"
          ecb_rate_to: "0.85"
      eoy_balances_expected:
        CHF: "3000.00"
        GBP: "500.00"
    expected:
      rgls:
        - realization_type: FX_CONVERSION_SALE
          currency: CHF
          quantity: "2000.00"
          realization_date: "2023-08-15"
          total_cost_basis_eur: "2040.82"
          total_proceeds_eur: "1764.71"
          gain_loss_eur: "-276.11"
          tax_category: ANLAGE_KAP_SONSTIGE_VERLUSTE
        - realization_type: FX_CONVERSION_SHORT_COVER
          currency: GBP
          quantity: "1000.00"
          realization_date: "2023-08-15"
          total_cost_basis_eur: "1388.89"
          total_proceeds_eur: "1136.36"
          gain_loss_eur: "-252.53"
          tax_category: ANLAGE_KAP_SONSTIGE_VERLUSTE
      kap_other_losses_abs: "528.64"
