          gain_loss_eur: "1000.00"
          tax_category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE
          holding_period_exemption: false  # NO exemption even after 2+ years
      kap_other_income_positive: "1000.00"
      errors: 0
      notes: |
        CRITICAL: This is NOT §23 EStG (private sales) where 1-year exemption applies.
        This is §20 EStG (capital income from interest-bearing accounts).
        Per BMF 2022 Para 131: IBKR FX balances are interest-bearing = always taxable.

  # ===========================================================================
  # PART B: IMPLICIT FX FROM SECURITY TRADES (CFX_I_*)
  # Phase 5a: Currency consumption/acquisition from stock trades
  # ===========================================================================

  - id: CFX_I_001
    description: "Buy USD stock with existing USD balance - FX gain"
    notes: |
      Implicit FX: When you buy a stock using foreign currency, you are
      implicitly disposing of that currency, triggering an FX gain/loss.

      SOY: 5000 USD (acquired at ECB rate 1.20 → cost basis 4166.67 EUR)
      Buy: 100 AAPL @ 150 USD = 15000 USD gross on Mar 15
      ECB rate on Mar 15: 1.10 USD/EUR → 15000 USD = 13636.36 EUR

      Currency FIFO:
      - Consume 5000 USD from long lot
        - Cost basis: 5000 / 1.20 = 4166.67 EUR
        - Disposal value: 5000 / 1.10 = 4545.45 EUR
        - FX gain: 4545.45 - 4166.67 = 378.78 EUR (USD strengthened)
      - Open short for remaining 10000 USD at rate 1.10

      EOY: -10000 USD (short position)
    inputs:
      currencies:
        - currency: USD
          soy_balance: "5000.00"
          soy_cost_basis_eur: "4166.67"
          soy_acquisition_date: "2022-05-01"
      security_trades:
        - type: BUY_LONG
          date: "2023-03-15"
          asset_symbol: AAPL
          asset_isin: US0378331005
          quantity: 100
          price_foreign: "150.00"
          local_currency: USD
          ecb_rate: "1.10"
      eoy_balance_expected: "-10000.00"
    expected:
      currency_rgls:
        - realization_type: FX_IMPLICIT_SECURITY_PURCHASE
          currency: USD
          quantity: "5000.00"
          acquisition_date: "2022-05-01"
          realization_date: "2023-03-15"
          total_cost_basis_eur: "4166.67"
          total_proceeds_eur: "4545.45"
          gain_loss_eur: "378.78"
          tax_category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE
      eoy_state:
        quantity: "-10000.00"
        short_lots:
          - opening_date: "2023-03-15"
            quantity_shorted: "10000.00"
      kap_other_income_positive: "378.78"
      errors: 0
      notes: |
        Stock trade creates AAPL position with cost basis 13636.36 EUR.
        Currency trade realizes FX gain on consumed USD.
        Both are independent tax events.

