  - id: CFX_HP_001
    description: "No holding period exemption - Same day round-trip is taxable"
    notes: |
      Unlike §23 EStG (1-year holding period), §20 EStG has NO exemption.
      Even a same-day FX round-trip is fully taxable.

      Buy 1000 USD @ rate 1.25 (cost 800 EUR)
      Sell 1000 USD @ rate 1.0 (proceeds 1000 EUR)
      Gain: 1000 - 800 = 200 EUR (TAXABLE - no exemption!)
    inputs:
      currency: USD
      soy_balance: "0.00"
      fx_trades:
        - type: BUY_FOREIGN
          date: "2023-06-15"
          time: "10:00:00"
          from_currency: EUR
          from_amount: "800"
          to_currency: USD
          to_amount: "1000"
          ecb_rate: "1.25"
        - type: SELL_FOREIGN
          date: "2023-06-15"
          time: "14:00:00"
          from_currency: USD
          from_amount: "1000"
          to_currency: EUR
          to_amount: "1000"
          ecb_rate: "1.0"
    expected:
      rgls:
        - realization_type: FX_CONVERSION_SALE
          currency: USD
          quantity: "1000"
          acquisition_date: "2023-06-15"
          realization_date: "2023-06-15"
          total_cost_basis_eur: "800.00"
          total_proceeds_eur: "1000.00"
          gain_loss_eur: "200.00"
          tax_category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE
          holding_period_exemption: false  # Explicitly: NO exemption for FX
      errors: 0

  - id: CFX_HP_002
    description: "No holding period exemption - Multi-year holding still taxable"
    notes: |
      Unlike §23 EStG where >1 year holding = exempt,
      §20 EStG for FX: >1 year holding = STILL TAXABLE

      Buy 5000 USD in 2021 (cost basis 4000 EUR at rate 1.25)
      Sell all in 2023 at rate 1.0 = 5000 EUR
      Gain: 5000 - 4000 = 1000 EUR (TAXABLE - no exemption despite 2+ years held!)
    inputs:
      currency: USD
      soy_balance: "0.00"
      fx_trades:
        - type: BUY_FOREIGN
          date: "2021-03-15"
          from_currency: EUR
          from_amount: "4000"
          to_currency: USD
          to_amount: "5000"
          ecb_rate: "1.25"
        - type: SELL_FOREIGN
          date: "2023-10-20"
          from_currency: USD
          from_amount: "5000"
          to_currency: EUR
          to_amount: "5000"
          ecb_rate: "1.0"
    expected:
