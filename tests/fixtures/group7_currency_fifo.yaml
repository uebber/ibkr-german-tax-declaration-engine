  # ===========================================================================
  # PART G: ERROR CONDITIONS AND BOUNDARY CASES (CFX_ERR_*)
  # ===========================================================================

  - id: CFX_ERR_001
    description: "Missing trade rate - DataIntegrityError"
    notes: |
      Bug Detection: Verify system rejects FX trades with missing rates.

      When ecb_rate is null (missing), the CSV row has TradePrice=0.
      The parser raises DataIntegrityError because a zero rate indicates
      corrupt input data that cannot be processed for tax reporting.
    expect_pipeline_error: true
    inputs:
      currency: XYZ  # Exotic currency with no rate
      soy_balance: "1000.00"
      fx_trades:
        - type: SELL_FOREIGN
          date: "2023-06-01"
          from_currency: XYZ
          from_amount: "500.00"
          to_currency: EUR
          to_amount: "450.00"
          ecb_rate: null  # Missing rate - parser will raise DataIntegrityError
      eoy_balance_expected: "1000.00"
    expected:
      rgls: []
      errors: 0

  - id: CFX_ERR_002
    description: "Negative quantity in FX trade - error handling"
    notes: |
      Bug Detection: Verify system rejects invalid negative quantities.

      When from_amount is negative, the trade is invalid and should be
      skipped during CSV row creation. No FIFO lot is consumed, no RGL
      is generated, and the SOY balance remains unchanged.
    inputs:
      currency: USD
      soy_balance: "1000.00"
      fx_trades:
        - type: SELL_FOREIGN
          date: "2023-06-01"
          from_currency: USD
          from_amount: "-500.00"  # Invalid negative - trade will be skipped
          to_currency: EUR
          to_amount: "450.00"
          ecb_rate: "1.11"
      eoy_balance_expected: "1000.00"  # Unchanged - invalid trade skipped
    expected:
      rgls: []  # No RGL - invalid trade skipped
      errors: 0  # No EOY mismatch

  - id: CFX_ERR_003
    description: "Consume from empty lot - short position handling"
    notes: |
      Edge Case: Selling currency when no long lots exist opens short.
      Verify short opening is correctly handled.
    inputs:
      currency: USD
      soy_balance: "0.00"
      fx_trades:
        - type: SELL_FOREIGN
          date: "2023-06-01"
          from_currency: USD
