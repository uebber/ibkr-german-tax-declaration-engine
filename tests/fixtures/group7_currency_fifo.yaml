  - id: CFX_XS_001
    description: "Buy GBP stock with USD settlement - cross-currency"
    notes: |
      Cross-Currency Security Trade: Buy a GBP-denominated stock, settled in USD.
      The FX impact is on the SETTLEMENT currency (USD), not the asset currency (GBP).
      IBKR reports the trade in the settlement currency, so price_foreign is in USD.

      SOY: 10000 USD (cost 8000 EUR, unit cost 0.80 EUR/USD)

      Buy: 50 VOD.L settled at 100 USD/share = 5000 USD consumed
      ECB rate on trade date: 1.00 (1 EUR = 1.00 USD)

      Currency impact (on SETTLEMENT currency USD):
      - Consume 5000 USD from FIFO
        - Cost: 5000 × 0.80 = 4000.00 EUR
        - Disposal value: 5000 / 1.00 = 5000.00 EUR
        - Gain: +1000.00 EUR

      EOY: 5000 USD
    inputs:
      currencies:
        - currency: USD
          soy_balance: "10000.00"
          soy_cost_basis_eur: "8000.00"
          soy_acquisition_date: "2022-05-01"
      security_trades:
        - type: BUY_LONG
          date: "2023-06-01"
          asset_symbol: VOD.L
          asset_isin: GB00BH4HKS39
          quantity: 50
          price_foreign: "100.00"
          local_currency: USD  # Settlement currency (not asset's native GBP)
          ecb_rate: "1.00"
      eoy_balance_expected: "5000.00"
