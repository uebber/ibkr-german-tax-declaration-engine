  - id: CFX_X_001
    description: "Cross-currency: USD to GBP (neither is EUR)"
    notes: |
      Legal: Cross-currency trades are valued through EUR bridge.
      Both sides trigger independent FIFO operations.

      SOY: 2000 USD (cost 1818.18 EUR @ 1.10, unit cost 0.90909 EUR/USD)
             0 GBP
      Trade: Convert 1500 USD → 1200 GBP on Jun 1
      ECB USD rate: 1.08, ECB GBP rate: 0.86

      USD side (disposal): Sell 1500 USD
        - Proceeds = EUR value of GBP received: 1200/0.86 = 1395.35 EUR
        - Cost = FIFO: 1500 × 0.90909 = 1363.64 EUR
        - Gain: 1395.35 - 1363.64 = 31.71 EUR

      GBP side (acquisition): Buy 1200 GBP
        - Cost = EUR value of USD paid: 1500/1.08 = 1388.89 EUR
        - Creates new lot, no RGL

      EOY: 500 USD, 1200 GBP
    inputs:
      currencies:
        - currency: USD
          soy_balance: "2000.00"
          soy_cost_basis_eur: "1818.18"
          soy_acquisition_date: "2022-07-01"
        - currency: GBP
          soy_balance: "0.00"
      fx_trades:
        - type: CROSS_CURRENCY
          date: "2023-06-01"
          from_currency: USD
          from_amount: "1500.00"
          to_currency: GBP
          to_amount: "1200.00"
          ecb_rate_from: "1.08"   # USD/EUR
          ecb_rate_to: "0.86"     # GBP/EUR
      eoy_balances_expected:
        USD: "500.00"
        GBP: "1200.00"
    expected:
      rgls:
        - realization_type: FX_CONVERSION_SALE
          currency: USD
          quantity: "1500.00"
          realization_date: "2023-06-01"
          total_cost_basis_eur: "1363.64"
          total_proceeds_eur: "1395.35"
          gain_loss_eur: "31.71"
          tax_category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE
      eoy_states:
        - currency: USD
          quantity: "500.00"
        - currency: GBP
          quantity: "1200.00"
      kap_other_income_positive: "31.71"
      kap_other_losses_abs: "0.00"
      errors: 0

  - id: CFX_X_002
    description: "Cross-currency: CHF to GBP covering GBP short"
    notes: |
      SOY: 5000 CHF (cost 5102.04 EUR @ 0.98, unit cost 1.020408 EUR/CHF)
           -1000 GBP (short proceeds 1136.36 EUR @ 0.88)
      Trade: Convert 2000 CHF → 1500 GBP on Aug 15
      ECB CHF rate: 0.96, ECB GBP rate: 0.85

