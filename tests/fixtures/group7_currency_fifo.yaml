        - Cost = FIFO: 2000 × 1.020408 = 2040.82 EUR
        - Loss: 1764.71 - 2040.82 = -276.11 EUR

      GBP side (acquisition): Buy 1500 GBP
        - Cost = EUR value of CHF paid: 2000/0.96 = 2083.33 EUR
        - Unit cost: 2083.33/1500 = 1.3889 EUR/GBP
        - Cover 1000 short: original proceeds 1136.36, cover cost 1388.89
          - Loss: 1136.36 - 1388.89 = -252.53 EUR
        - Create 500 long @ 1.3889 EUR/GBP

      EOY: 3000 CHF, 500 GBP
    inputs:
