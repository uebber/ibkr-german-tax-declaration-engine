      FIFO covers Jan 15 short first
      Cover RGL: proceeds 370.37 EUR (399.9975/499.9968 * 462.96), cost 380.95, loss -10.58 EUR

      Remaining short: 99.9993 USD from Jan 15 + 300.003 USD from Feb 20 = 400.0023 USD
