      Buy: 2000 USD @ rate 1.25 (cost 1600 EUR)
      Sell: 1000 USD @ rate 1.0 (proceeds 1000 EUR)

      FIFO: Sell 1000 USD from prior year lot
      Cost = 1000 * 0.8 = 800 EUR
      RGL = 1000 - 800 = 200 EUR gain

      Calculated EOY: 5000 + 2000 - 1000 = 6000 USD
      Actual EOY from file: 5800 USD (200 USD discrepancy - maybe fee)
