    expected:
      currency_rgls:
        - realization_type: FX_IMPLICIT_SECURITY_PURCHASE
          currency: USD
          quantity: "7500.00"
          acquisition_date: "2022-08-01"
          realization_date: "2023-06-20"
          total_cost_basis_eur: "7142.86"
          total_proceeds_eur: "6521.74"
          gain_loss_eur: "-621.12"
          tax_category: ANLAGE_KAP_SONSTIGE_VERLUSTE
      eoy_state:
        quantity: "2500.00"
        lots:
          - acquisition_date: "2022-08-01"
            quantity: "2500.00"
      kap_other_losses_abs: "621.12"
      errors: 0

  - id: CFX_I_003
    description: "Sell USD stock - receive USD into cash balance (no FX event)"
    notes: |
