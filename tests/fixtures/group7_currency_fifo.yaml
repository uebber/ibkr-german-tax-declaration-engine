# Test Group 7: Currency FIFO Mechanics
#
# Revision: 2026-01-13
# PRD Coverage: §20 EStG (Capital Income from Interest-Bearing Accounts)
#
# Legal Background:
# - BMF Circular May 2022, Para. 131: IBKR FX reserves are "interest-bearing"
# - Foreign currency gains from interest-bearing instruments: §20 EStG (NOT §23 EStG)
# - Key implications:
#   - NO 1-year holding period applies - ALL gains are taxable immediately
#   - Report on Anlage KAP Zeile 19
#   - Tax category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE (gains)
#                   ANLAGE_KAP_SONSTIGE_VERLUSTE (losses)
# - FIFO method: §23 EStG codified (2014) - applies to currency disposals
#
# References:
# - Flick Gocke Schaumburg: "New Rules on Taxing Foreign Currency Gains in Private Assets"
# - Private Banking Magazine: "Fremdwährungskonten"
#
# Test Organization:
# - CFX_L_*   : Long position explicit FX trades
# - CFX_SOY_* : SOY position handling
# - CFX_S_*   : Short position explicit FX trades
# - CFX_X_*   : Cross-currency trades
# - CFX_E_*   : Edge cases
# - CFX_HP_*  : Holding period verification (no exemption)
# - CFX_I_*   : Implicit FX from security trades (Phase 5a)
# - CFX_IS_*  : Implicit FX with short currency positions
# - CFX_MIX_* : Mixed explicit FX + implicit security trades
# - CFX_P_*   : Precision and rounding edge cases
# - CFX_V_*   : Validation and EOY reconciliation
#
# Common assumptions:
# - TAX_YEAR = 2023
# - Base currency: EUR
# - ECB exchange rate applies at trade date
# - Gains → Anlage KAP Zeile 19 (kap_other_income_positive)
# - Losses → Anlage KAP Zeile 19 (kap_other_losses_abs)

metadata:
  group: 7
  name: Currency FIFO Mechanics
  prd_section: "§20 EStG, BMF 2022 Para 131"
  revision: "2026-01-13"
  legal_basis: |
    BMF Circular May 2022, Para. 131: Foreign currency held in interest-bearing
    brokerage accounts (such as IBKR) is treated as capital income under §20 EStG.
    This means:
    - No speculation period (1 year) unlike §23 EStG private sales
    - All realized FX gains are taxable regardless of holding period
    - All realized FX losses are deductible against capital income
    - Reported on Anlage KAP Zeile 19

tests:
  # ===========================================================================
  # PART A: EXPLICIT FX TRADES - Long Position Tests (CFX_L_*)
  # ===========================================================================

  - id: CFX_L_001
    description: "Simple FX round-trip with gain - Buy USD, sell USD at higher rate"
    notes: |
      Buy 999.999 USD with EUR at rate 1.10 (cost 909.09 EUR)
      Sell 999.999 USD for EUR at rate 1.05 (proceeds 952.38 EUR)
      Gain: 952.38 - 909.09 = 43.29 EUR

      USD strengthened from 1.10 to 1.05 EUR/USD = gain
    inputs:
      currency: USD
      soy_balance: "0.00"
      fx_trades:
        - type: BUY_FOREIGN       # EUR → USD
          date: "2023-02-15"
          from_currency: EUR
          from_amount: "909.09"
          to_currency: USD
          to_amount: "999.999"    # 909.09 * 1.10
          ecb_rate: "1.10"        # USD/EUR rate
        - type: SELL_FOREIGN      # USD → EUR
          date: "2023-09-20"
          from_currency: USD
          from_amount: "999.999"  # Must match buy amount for full sale
          to_currency: EUR
          to_amount: "952.38"
          ecb_rate: "1.05"
      eoy_balance_expected: "0.00"
    expected:
      rgls:
        - realization_type: FX_CONVERSION_SALE
          currency: USD
          quantity: "999.999"
          acquisition_date: "2023-02-15"
          realization_date: "2023-09-20"
          total_cost_basis_eur: "909.09"
          total_proceeds_eur: "952.38"
          gain_loss_eur: "43.29"
          tax_category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE
      kap_other_income_positive: "43.29"
      kap_other_losses_abs: "0.00"
      errors: 0

  - id: CFX_L_002
    description: "Simple FX round-trip with loss - Buy USD, sell USD at lower rate"
    notes: |
      Buy 1000 USD with EUR at rate 1.25 (cost 800 EUR)
      Sell 1000 USD for EUR at rate 1.25 (proceeds 800 EUR, but we sell at rate 1.6)
      Using clean divisible values: rate 1.25 = 5/4

      Actually, let's use: Buy 1000 USD @ 1.25, Sell 1000 USD @ 1.6
      Buy: 800 EUR * 1.25 = 1000 USD (cost 800 EUR)
      Sell: 625 EUR * 1.6 = 1000 USD (proceeds 625 EUR)
      Loss: 625 - 800 = -175 EUR
    inputs:
      currency: USD
      soy_balance: "0.00"
      fx_trades:
        - type: BUY_FOREIGN
          date: "2023-03-01"
          from_currency: EUR
          from_amount: "800"
          to_currency: USD
          to_amount: "1000"              # 800 * 1.25 = 1000
          ecb_rate: "1.25"
        - type: SELL_FOREIGN
          date: "2023-11-15"
          from_currency: USD
          from_amount: "1000"
          to_currency: EUR
          to_amount: "625"               # 1000 / 1.6 = 625
          ecb_rate: "1.6"
      eoy_balance_expected: "0.00"
    expected:
      rgls:
        - realization_type: FX_CONVERSION_SALE
          currency: USD
          quantity: "1000"
          acquisition_date: "2023-03-01"
          realization_date: "2023-11-15"
          total_cost_basis_eur: "800.00"
          total_proceeds_eur: "625.00"
          gain_loss_eur: "-175.00"
          tax_category: ANLAGE_KAP_SONSTIGE_VERLUSTE
      kap_other_income_positive: "0.00"
      kap_other_losses_abs: "175.00"
      errors: 0

  - id: CFX_L_003
    description: "Partial sale - Buy 5000 USD, sell 3000 USD, EOY 2000 USD remains"
    notes: |
      Using clean divisible values:
      Buy: 4000 EUR * 1.25 = 5000 USD (cost 4000 EUR)
      Sell: 2400 EUR * 1.25 = 3000 USD (proceeds 2400 EUR, same rate for simplicity)

      FIFO: 3000 of 5000 from single lot
      Proportional cost: 4000 * (3000/5000) = 2400 EUR
      Gain/Loss: 2400 - 2400 = 0 EUR (break even at same rate)

      Let's make it a gain by selling at better rate:
      Sell: 2000 EUR * 1.5 = 3000 USD (proceeds 2000 EUR)
      Cost: 4000 * (3000/5000) = 2400 EUR
      Loss: 2000 - 2400 = -400 EUR
    inputs:
      currency: USD
      soy_balance: "0.00"
      fx_trades:
        - type: BUY_FOREIGN
          date: "2023-04-10"
          from_currency: EUR
          from_amount: "4000"
          to_currency: USD
          to_amount: "5000"              # 4000 * 1.25 = 5000
          ecb_rate: "1.25"
        - type: SELL_FOREIGN
          date: "2023-08-25"
          from_currency: USD
          from_amount: "3000"
          to_currency: EUR
          to_amount: "2000"              # 3000 / 1.5 = 2000
          ecb_rate: "1.5"
      eoy_balance_expected: "2000"
    expected:
      rgls:
        - realization_type: FX_CONVERSION_SALE
          currency: USD
          quantity: "3000"
          acquisition_date: "2023-04-10"
          realization_date: "2023-08-25"
          total_cost_basis_eur: "2400.00"
          total_proceeds_eur: "2000.00"
          gain_loss_eur: "-400.00"
          tax_category: ANLAGE_KAP_SONSTIGE_VERLUSTE
      eoy_state:
        quantity: "2000"
        lots:
          - acquisition_date: "2023-04-10"
            quantity: "2000"
            unit_cost_basis_eur: "0.80"   # 4000/5000
      kap_other_income_positive: "0.00"
      kap_other_losses_abs: "400.00"
      errors: 0

  - id: CFX_L_004
    description: "Multiple buys, single sell - FIFO consumes oldest lot first"
    notes: |
      Buy 1000 USD @ 1.25 on Jan 15 (cost 800 EUR)
      Buy 1800 USD @ 1.5 on Mar 20 (cost 1200 EUR)
      Sell 1600 USD @ 1.25 on Sep 10 (proceeds 1280 EUR)

      FIFO: Uses 1000 from lot1, 600 from lot2
      Lot1 cost: 800 EUR (full lot)
      Lot2 partial cost: 1200 * (600/1800) = 400 EUR
      Total cost: 800 + 400 = 1200 EUR
      Total proceeds: 1280 EUR
      Gain: 1280 - 1200 = 80 EUR

      Remaining: 1800 - 600 = 1200 USD from lot2
    inputs:
      currency: USD
      soy_balance: "0.00"
      fx_trades:
        - type: BUY_FOREIGN
          date: "2023-01-15"
          from_currency: EUR
          from_amount: "800"
          to_currency: USD
          to_amount: "1000"              # 800 * 1.25 = 1000
          ecb_rate: "1.25"
        - type: BUY_FOREIGN
          date: "2023-03-20"
          from_currency: EUR
          from_amount: "1200"
          to_currency: USD
          to_amount: "1800"              # 1200 * 1.5 = 1800
          ecb_rate: "1.5"
        - type: SELL_FOREIGN
          date: "2023-09-10"
          from_currency: USD
          from_amount: "1600"
          to_currency: EUR
          to_amount: "1280"              # 1600 / 1.25 = 1280
          ecb_rate: "1.25"
      eoy_balance_expected: "1200"
    expected:
      rgls:
        # Two RGLs due to FIFO crossing lot boundary
        - realization_type: FX_CONVERSION_SALE
          currency: USD
          quantity: "1000"
          acquisition_date: "2023-01-15"
          realization_date: "2023-09-10"
          total_cost_basis_eur: "800.00"
          total_proceeds_eur: "800.00"    # 1000/1600 * 1280 = 800
          gain_loss_eur: "0.00"
          tax_category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE
        - realization_type: FX_CONVERSION_SALE
          currency: USD
          quantity: "600"
          acquisition_date: "2023-03-20"
          realization_date: "2023-09-10"
          total_cost_basis_eur: "400.00"
          total_proceeds_eur: "480.00"    # 600/1600 * 1280 = 480
          gain_loss_eur: "80.00"
          tax_category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE
      kap_other_income_positive: "80.00"
      kap_other_losses_abs: "0.00"
      errors: 0

  - id: CFX_L_005
    description: "Multiple sells crossing lot boundaries with mixed gain/loss"
    notes: |
      FIFO Bug Detection: Ensure proceeds are correctly apportioned across lot boundaries

      Buy 1000 USD @ 2.5 on Feb 1 (cost 400 EUR)
      Buy 1500 USD @ 2.0 on Mar 1 (cost 750 EUR)
      Sell 800 USD @ 2.0 on Jun 1 (proceeds 400 EUR)
      Sell 2000 USD @ 2.5 on Sep 1 (proceeds 800 EUR)

      Sale 1: 800 from lot1 → cost 320, proceeds 400, gain 80
      Sale 2: 200 from lot1 + 1500 from lot2 + opens 300 short
        - Lot1 portion: cost 80, proceeds 80, gain 0
        - Lot2 portion: cost 750, proceeds 600, loss -150
        - Net loss: -70 EUR (80 gain - 150 loss)
    inputs:
      currency: USD
      soy_balance: "0.00"
      fx_trades:
        - type: BUY_FOREIGN
          date: "2023-02-01"
          from_currency: EUR
          from_amount: "400"
          to_currency: USD
          to_amount: "1000"              # 400 * 2.5 = 1000
          ecb_rate: "2.5"
        - type: BUY_FOREIGN
          date: "2023-03-01"
          from_currency: EUR
          from_amount: "750"
          to_currency: USD
          to_amount: "1500"              # 750 * 2.0 = 1500
          ecb_rate: "2.0"
        - type: SELL_FOREIGN
          date: "2023-06-01"
          from_currency: USD
          from_amount: "800"
          to_currency: EUR
          to_amount: "400"               # 800 / 2.0 = 400
          ecb_rate: "2.0"
        - type: SELL_FOREIGN
          date: "2023-09-01"
          from_currency: USD
          from_amount: "2000"
          to_currency: EUR
          to_amount: "800"               # 2000 / 2.5 = 800
          ecb_rate: "2.5"
      eoy_balance_expected: "-300"       # Oversold - opens short position
    expected:
      rgls:
        - realization_type: FX_CONVERSION_SALE
          currency: USD
          quantity: "800"
          acquisition_date: "2023-02-01"
          realization_date: "2023-06-01"
          total_cost_basis_eur: "320.00"
          total_proceeds_eur: "400.00"
          gain_loss_eur: "80.00"
          tax_category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE
        - realization_type: FX_CONVERSION_SALE
          currency: USD
          quantity: "200"
          acquisition_date: "2023-02-01"
          realization_date: "2023-09-01"
          total_cost_basis_eur: "80.00"
          total_proceeds_eur: "80.00"    # 200/2000 * 800 = 80
          gain_loss_eur: "0.00"
          tax_category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE
        - realization_type: FX_CONVERSION_SALE
          currency: USD
          quantity: "1500"
          acquisition_date: "2023-03-01"
          realization_date: "2023-09-01"
          total_cost_basis_eur: "750.00"
          total_proceeds_eur: "600.00"   # 1500/2000 * 800 = 600
          gain_loss_eur: "-150.00"
          tax_category: ANLAGE_KAP_SONSTIGE_VERLUSTE
      eoy_state:
        quantity: "-300"
        short_lots:
          - opening_date: "2023-09-01"
            quantity_shorted: "300"
      kap_other_income_positive: "80.00"
      kap_other_losses_abs: "150.00"
      errors: 0

  # ===========================================================================
  # PART A: SOY Position Tests (CFX_SOY_*)
  # ===========================================================================

  - id: CFX_SOY_001
    description: "SOY balance, no trades, EOY matches - No FX events"
    notes: |
      Start with 1000 USD, no FX activity during year
      No gain/loss realized (still holding currency)
    inputs:
      currency: USD
      soy_balance: "1000.00"
      soy_cost_basis_eur: "925.93"  # Acquired at rate 1.08
      soy_acquisition_date: "2022-06-15"
      fx_trades: []
      eoy_balance_expected: "1000.00"
    expected:
      rgls: []
      eoy_state:
        quantity: "1000.00"
        lots:
          - acquisition_date: "2022-06-15"
            quantity: "1000.00"
            unit_cost_basis_eur: "0.9259"
      kap_other_income_positive: "0.00"
      kap_other_losses_abs: "0.00"
      errors: 0

  - id: CFX_SOY_002
    description: "Prior year position, sell all in current year"
    notes: |
      Buy 3000 USD in 2022 (cost 2400 EUR at rate 1.25)
      Sell all in 2023 at rate 1.2 (proceeds 2500 EUR)
      Gain: 2500 - 2400 = 100 EUR
    inputs:
      currency: USD
      soy_balance: "0.00"
      fx_trades:
        - type: BUY_FOREIGN
          date: "2022-08-01"
          from_currency: EUR
          from_amount: "2400"
          to_currency: USD
          to_amount: "3000"              # 2400 * 1.25 = 3000
          ecb_rate: "1.25"
        - type: SELL_FOREIGN
          date: "2023-05-15"
          from_currency: USD
          from_amount: "3000"
          to_currency: EUR
          to_amount: "2500"              # 3000 / 1.2 = 2500
          ecb_rate: "1.2"
      eoy_balance_expected: "0.00"
    expected:
      rgls:
        - realization_type: FX_CONVERSION_SALE
          currency: USD
          quantity: "3000"
          acquisition_date: "2022-08-01"
          realization_date: "2023-05-15"
          total_cost_basis_eur: "2400.00"
          total_proceeds_eur: "2500.00"
          gain_loss_eur: "100.00"
          tax_category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE
      eoy_state:
        quantity: "0.00"
      kap_other_income_positive: "100.00"
      kap_other_losses_abs: "0.00"
      errors: 0

  - id: CFX_SOY_003
    description: "Prior year position + current year buy, partial sell - FIFO order"
    notes: |
      Buy 2000 USD in 2022 (cost 1600 EUR at rate 1.25)
      Buy 1500 USD in 2023 Mar (cost 750 EUR at rate 2.0)
      Total: 3500 USD
      Sell 2500 USD in 2023 Oct at rate 1.25 → 2000 EUR

      FIFO: 2000 from 2022 lot + 500 from Mar lot
      2022 lot: cost 1600, proceeds 2000/2500×2000=1600, gain 0
      Mar lot partial: cost 750×500/1500=250, proceeds 500/2500×2000=400, gain 150

      Remaining: 1000 USD from Mar lot
    inputs:
      currency: USD
      soy_balance: "0.00"
      fx_trades:
        - type: BUY_FOREIGN
          date: "2022-09-15"
          from_currency: EUR
          from_amount: "1600"
          to_currency: USD
          to_amount: "2000"              # 1600 * 1.25 = 2000
          ecb_rate: "1.25"
        - type: BUY_FOREIGN
          date: "2023-03-01"
          from_currency: EUR
          from_amount: "750"
          to_currency: USD
          to_amount: "1500"              # 750 * 2.0 = 1500
          ecb_rate: "2.0"
        - type: SELL_FOREIGN
          date: "2023-10-01"
          from_currency: USD
          from_amount: "2500"
          to_currency: EUR
          to_amount: "2000"              # 2500 / 1.25 = 2000
          ecb_rate: "1.25"
      eoy_balance_expected: "1000"
    expected:
      rgls:
        - realization_type: FX_CONVERSION_SALE
          currency: USD
          quantity: "2000"
          acquisition_date: "2022-09-15"
          realization_date: "2023-10-01"
          total_cost_basis_eur: "1600.00"
          total_proceeds_eur: "1600.00"  # 2000/2500 * 2000 = 1600
          gain_loss_eur: "0.00"
          tax_category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE
        - realization_type: FX_CONVERSION_SALE
          currency: USD
          quantity: "500"
          acquisition_date: "2023-03-01"
          realization_date: "2023-10-01"
          total_cost_basis_eur: "250.00"
          total_proceeds_eur: "400.00"   # 500/2500 * 2000 = 400
          gain_loss_eur: "150.00"
          tax_category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE
      eoy_state:
        quantity: "1000"
        lots:
          - acquisition_date: "2023-03-01"
            quantity: "1000"
      kap_other_income_positive: "150.00"
      kap_other_losses_abs: "0.00"
      errors: 0

  - id: CFX_SOY_004
    description: "Prior year position with gain on sale"
    notes: |
      Buy 3000 USD in 2022 (cost 2000 EUR at rate 1.5)
      Sell all in 2023 at rate 1.2 → proceeds 2500 EUR
      Gain: 2500 - 2000 = 500 EUR
    inputs:
      currency: USD
      soy_balance: "0.00"
      fx_trades:
        - type: BUY_FOREIGN
          date: "2022-04-20"
          from_currency: EUR
          from_amount: "2000"
          to_currency: USD
          to_amount: "3000"              # 2000 * 1.5 = 3000
          ecb_rate: "1.5"
        - type: SELL_FOREIGN
          date: "2023-07-15"
          from_currency: USD
          from_amount: "3000"
          to_currency: EUR
          to_amount: "2500"              # 3000 / 1.2 = 2500
          ecb_rate: "1.2"
      eoy_balance_expected: "0.00"
    expected:
      rgls:
        - realization_type: FX_CONVERSION_SALE
          currency: USD
          quantity: "3000"
          acquisition_date: "2022-04-20"
          realization_date: "2023-07-15"
          total_cost_basis_eur: "2000.00"
          total_proceeds_eur: "2500.00"
          gain_loss_eur: "500.00"
          tax_category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE
      kap_other_income_positive: "500.00"
      errors: 0

  # ===========================================================================
  # PART A: Short Position Tests (CFX_S_*)
  # ===========================================================================

  - id: CFX_S_001
    description: "Short currency open and cover with gain - Sell USD short, buy back lower"
    notes: |
      Legal: Short selling currency = borrowing then selling, taxable under §20 EStG

      No SOY balance (start with 0 USD)
      Sell (short) 1000 USD at rate 1.25 (proceeds 800 EUR)
      Buy (cover) 1000 USD at rate 2.0 (cost 500 EUR)

      Short gain = proceeds - cover cost = 800 - 500 = 300 EUR
    inputs:
      currency: USD
      soy_balance: "0.00"
      fx_trades:
        - type: SELL_FOREIGN     # Opens short position
          date: "2023-04-01"
          from_currency: USD
          from_amount: "1000"
          to_currency: EUR
          to_amount: "800"               # 1000 / 1.25 = 800
          ecb_rate: "1.25"
        - type: BUY_FOREIGN      # Covers short position
          date: "2023-07-15"
          from_currency: EUR
          from_amount: "500"
          to_currency: USD
          to_amount: "1000"              # 500 * 2.0 = 1000
          ecb_rate: "2.0"
      eoy_balance_expected: "0.00"
    expected:
      rgls:
        - realization_type: FX_CONVERSION_SHORT_COVER
          currency: USD
          quantity: "1000"
          acquisition_date: "2023-04-01"   # Short opening date
          realization_date: "2023-07-15"   # Cover date
          total_cost_basis_eur: "500.00"   # Cover cost
          total_proceeds_eur: "800.00"     # Short sale proceeds
          gain_loss_eur: "300.00"
          tax_category: ANLAGE_KAP_SONSTIGE_KAPITALERTRAEGE
      eoy_state:
        quantity: "0.00"
      kap_other_income_positive: "300.00"
      kap_other_losses_abs: "0.00"
      errors: 0

  - id: CFX_S_002
    description: "Short currency open and cover with loss - Sell USD short, buy back higher"
    notes: |
      No SOY balance
      Sell (short) 1000.0032 USD at rate 1.12 (proceeds 892.86 EUR)
      Buy (cover) 999.999 USD at rate 1.05 (cost 952.38 EUR)
      Note: 892.86 * 1.12 = 1000.0032 and 952.38 * 1.05 = 999.999

      Short loss = proceeds - cover cost = 892.86 - 952.38 = -59.52 EUR
    inputs:
      currency: USD
      soy_balance: "0.00"
      fx_trades:
        - type: SELL_FOREIGN
          date: "2023-02-10"
          from_currency: USD
          from_amount: "1000.0032"       # 892.86 * 1.12
          to_currency: EUR
          to_amount: "892.86"
          ecb_rate: "1.12"
        - type: BUY_FOREIGN
          date: "2023-10-20"
          from_currency: EUR
          from_amount: "952.38"
          to_currency: USD
          to_amount: "999.999"           # 952.38 * 1.05
          ecb_rate: "1.05"
      eoy_balance_expected: "-0.0042"    # 1000.0032 - 999.999 = residual short
    expected:
      rgls:
        - realization_type: FX_CONVERSION_SHORT_COVER
          currency: USD
          quantity: "999.999"
          acquisition_date: "2023-02-10"
          realization_date: "2023-10-20"
          total_cost_basis_eur: "952.38"
          total_proceeds_eur: "892.86"   # Proportional: 892.86 * (999.999/1000.0032)
          gain_loss_eur: "-59.52"
          tax_category: ANLAGE_KAP_SONSTIGE_VERLUSTE
      kap_other_income_positive: "0.00"
      kap_other_losses_abs: "59.52"
      errors: 0

  - id: CFX_S_003
    description: "Prior year short position, cover in tax year with gain"
    notes: |
      Prior year: Sold short 1000 USD at rate 1.25 (proceeds 800 EUR) on Nov 1, 2022
      Tax year: Buy to cover 1000 USD at rate 2.0 (cost 500 EUR)

      Gain = 800 - 500 = 300 EUR
    inputs:
      currency: USD
      soy_balance: "0.00"
      fx_trades:
        - type: SELL_FOREIGN     # Opens short in prior year
          date: "2022-11-01"
          from_currency: USD
          from_amount: "1000"
          to_currency: EUR
          to_amount: "800"               # 1000 / 1.25 = 800
          ecb_rate: "1.25"
        - type: BUY_FOREIGN      # Cover in tax year
          date: "2023-03-15"
          from_currency: EUR
          from_amount: "500"
          to_currency: USD
          to_amount: "1000"              # 500 * 2.0 = 1000
