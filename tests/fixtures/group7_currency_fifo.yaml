  - id: CFX_AGG_002
    description: "Mixed explicit FX and implicit security FX aggregate together"
    notes: |
      Aggregation Test: Both explicit FX trades and implicit FX from security trades
      should aggregate to the same Anlage KAP lines.

      SOY: 10000 USD (cost 9090.91 EUR, unit cost 0.909091 EUR/USD)

      Chronological events:
      1. Mar 01: Buy 80 AAPL @ 100 USD = consume 8000 USD from SOY lot
         - Cost: 8000 × 0.909091 = 7272.73 EUR
         - Value: 8000 / 1.12 = 7142.86 EUR
         - Implicit FX loss: -129.87 EUR
      2. Sep 01: Sell ~1998 USD (via CSV: qty 2018.18 EUR × rate 0.99)
         - Cost: 1997.998 × 0.909091 = 1816.36 EUR
         - Proceeds: 2018.18 EUR
         - Explicit FX gain: +201.82 EUR
      3. Nov 01: Sell 80 AAPL @ 110 USD = receive 8800 USD → new lot (no RGL)

      Total: kap_other_income_positive: 201.82 EUR (explicit gain)
             kap_other_losses_abs: 129.87 EUR (implicit loss)
             Net: 71.95 EUR
    inputs:
      currencies:
        - currency: USD
          soy_balance: "10000.00"
          soy_cost_basis_eur: "9090.91"
          soy_acquisition_date: "2022-01-01"
      fx_trades:
        - type: SELL_FOREIGN
          date: "2023-09-01"
          from_currency: USD
          from_amount: "2000.00"
          to_currency: EUR
          to_amount: "2018.18"
          ecb_rate: "0.99"
      security_trades:
        # Consume 8000 USD for security purchase → FX loss
        - type: BUY_LONG
          date: "2023-03-01"
          asset_symbol: AAPL
          asset_isin: US0378331005
          quantity: 80
          price_foreign: "100.00"
          local_currency: USD
          ecb_rate: "1.12"  # USD weaker → FX loss
        # Sell security, receive USD → lot creation only (no short cover)
        - type: SELL_LONG
          date: "2023-11-01"
          asset_symbol: AAPL
          asset_isin: US0378331005
          quantity: 80
          price_foreign: "110.00"
          local_currency: USD
          ecb_rate: "1.08"
    expected:
      kap_other_income_positive: "201.82"  # Explicit FX gain from USD sale
      kap_other_losses_abs: "129.87"  # Implicit FX loss from security purchase
      net_kap_other: "71.95"
      errors: 0
