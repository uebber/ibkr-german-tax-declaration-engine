  - id: CFX_AGG_001
    description: "FX gains and losses aggregate correctly on Anlage KAP"
    notes: |
      Aggregation Test: Multiple FX trades across 3 currencies aggregate to
      correct Anlage KAP lines (Zeile 19 gains, Zeile 22 losses).

      SOY positions (all with clean unit costs):
        USD: 5000 @ 1.00 EUR/USD (cost 5000 EUR)
